name: SanderSuite-Linux Audit

on:
  push:
    branches: [ "main", "master" ]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Compile Java
      run: |
        mkdir -p build
        javac -d build $(find src -name "*.java")
        echo "SanderSuite-Linux compiled successfully."
