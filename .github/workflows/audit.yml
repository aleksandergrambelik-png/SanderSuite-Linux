name: SanderSuite-Linux Audit

on:
  push:
    branches: [ "main", "master" ]

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Debug - List Files
      run: |
        echo "Current directory: $(pwd)"
        ls -la
        echo "--- src folder ---"
        ls -la src/com/sander/ || echo "src/com/sander/ not found"

    - name: Download SanderCoreLib.jar (Dependency)
      run: |
        mkdir -p lib
        echo "Downloading SanderCoreLib.jar..."
        wget https://github.com/aleksandergrambelik-png/SanderCoreLib/raw/main/SanderCoreLib.jar -O lib/SanderCoreLib.jar || echo "FAILED TO DOWNLOAD JAR"
        ls -la lib/

    - name: Compile Java Source
      run: |
        mkdir -p build
        echo "Compiling Java files..."
        javac -cp "lib/*" -d build $(find src -name "*.java") || echo "COMPILATION FAILED"
        echo "Compilation step finished."

    - name: Verify Compilation
      run: |
        echo "Checking compiled classes..."
        find build -name "*.class" | head -n 5
        echo "Verification complete."
